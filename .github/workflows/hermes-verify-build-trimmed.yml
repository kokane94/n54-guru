name: hermes-verify-build-trimmed
on:
  push:
    branches: [ main ]
  workflow_dispatch:
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Echo
        run: echo "trimmed works"
  # nothing - file ends here, but actually we need to add a step to jobs.build
      - name: Upload test
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-upload
          path: /tmp/nonexistent
      - name: Test gh-release
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-${{ github.run_number }}
          body: test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
